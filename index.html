<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short Form Learning — Build Tracker</title>

<style>
  :root{
    --bg:#0D0D0F;
    --panel:#17171A;
    --panel-alt:#1D1D21;
    --border:rgba(255,255,255,0.09);
    --border-strong:rgba(255,255,255,0.18);
    --text:#F2F2F0;
    --text-soft:#9A9A9A;
    --text-faint:#8A8A8A;
    --gold:#E0A73A;
    --gold-soft:rgba(224,167,58,0.14);
    --gold-ink:#1A1408;
    --teal:#4FBFA8;
    --teal-soft:rgba(79,191,168,0.14);
    --red:#E2735A;
    --red-soft:rgba(226,115,90,0.14);
    --lavender:#9C8FC9;
    --lavender-soft:rgba(156,143,201,0.14);
    --font:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .topbar{
    display:flex; align-items:center; gap:14px;
    padding:16px 28px; border-bottom:1px solid var(--border);
    background:var(--bg);
  }
  .brand-mark{
    width:34px; height:34px; border-radius:8px; background:var(--gold);
    color:var(--gold-ink); font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.2; }
  .brand-text strong{ font-size:14.5px; font-weight:600; }
  .brand-text span{ font-size:12px; color:var(--text-soft); }

  .wrap{ max-width:1240px; margin:0 auto; padding:28px 28px 60px; }

  .page-title h1{
    font-size:26px; font-weight:800; margin:0 0 8px; letter-spacing:-0.2px;
  }
  .page-title p{ margin:0 0 24px; color:var(--text-soft); font-size:14px; max-width:640px; line-height:1.5; }

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:20px 22px;
  }
  .filter-panel{ margin-bottom:20px; }

  .group-label{
    display:block; font-size:11px; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; color:var(--text-soft); margin-bottom:10px;
  }
  .filter-group{ margin-bottom:16px; }
  .filter-group:last-of-type{ margin-bottom:0; }
  .pillrow{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-other-input{
    width:100%; max-width:280px; margin-top:10px; padding:8px 11px; border:1px solid var(--border-strong);
    border-radius:7px; font-family:var(--font); font-size:13px; background:var(--panel-alt); color:var(--text);
  }
  .filter-other-input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(224,167,58,0.28); }

  .pill{
    background:transparent; border:1px solid var(--border-strong); color:var(--text-soft);
    border-radius:20px; padding:7px 14px; font-family:var(--font); font-size:13px;
    font-weight:500; cursor:pointer; transition:all .12s ease;
  }
  .pill:hover{ border-color:var(--text-soft); color:var(--text); }
